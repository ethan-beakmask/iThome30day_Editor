{% extends "base.html" %}
{% block title %}文章列表{% endblock %}
{% block body %}
<div x-data="articleList()" class="page-narrow">
  <div class="row g-3">
    <section class="col-lg-8">
      <h1 class="h4 mb-3">文章列表</h1>
      <div class="table-responsive border bg-white">
        <table class="table table-sm align-middle mb-0">
          <thead>
            <tr>
              <th><button class="sort-button" type="button" @click="sortBy('title')">標題 <span x-text="mark('title')"></span></button></th>
              <th>Slug</th>
              <th><button class="sort-button" type="button" @click="sortBy('updated_at')">更新時間 <span x-text="mark('updated_at')"></span></button></th>
              <th>圖片</th>
              <th>草稿 URL</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="item in sorted" :key="item.slug">
              <tr>
                <td x-text="item.title"></td>
                <td><code x-text="item.slug"></code></td>
                <td x-text="item.updated_at"></td>
                <td><span x-text="item.image_count"></span> 張，未上傳 <span x-text="item.unuploaded_count"></span></td>
                <td class="draft-cell" x-text="item.draft_url || ''"></td>
                <td><a class="btn btn-sm btn-outline-primary" :href="prefix + '/edit/' + item.slug">編輯</a></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>
    <aside class="col-lg-4">
      <section class="mb-4">
        <h2 class="h5 mb-3">新增文章</h2>
        <form @submit.prevent="createArticle" class="vstack gap-2">
          <input class="form-control" x-model="newSlug" placeholder="slug">
          <input class="form-control" x-model="newTitle" placeholder="標題">
          <button class="btn btn-primary" type="submit">新增文章</button>
        </form>
      </section>
      <section>
        <h2 class="h5 mb-3">匯入</h2>
        <form @submit.prevent="importArticle" class="vstack gap-2">
          <input class="form-control" x-model="importPath" placeholder="伺服器端檔案路徑">
          <input class="form-control" x-model="importSlug" placeholder="slug">
          <input class="form-control" x-model="importTitle" placeholder="標題">
          <button class="btn btn-outline-primary" type="submit">匯入</button>
        </form>
      </section>
      <p class="text-danger mt-3" x-text="error"></p>
    </aside>
  </div>
</div>
<script>
window.INITIAL_ARTICLES = {{ articles|tojson }};
window.APP_PREFIX = {{ prefix|tojson }};
</script>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='editor.js') }}"></script>
{% endblock %}
