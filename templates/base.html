<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}iThome 編輯器{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script defer src="{{ url_for('static', filename='vendor/alpine.min.js') }}"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom bg-white">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ prefix }}/">iThome 編輯器</a>
    </div>
  </nav>
  <main class="container-fluid py-3">
    {% block body %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
